<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hệ Thống Quản Lý Người Lao Động</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #f4f7f6;
            color: #333;
            padding: 20px;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
            background: #fff;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }
        h1 {
            text-align: center;
            color: #2c3e50;
            margin-bottom: 25px;
        }
        .form-section {
            background: #f9f9f9;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 25px;
            border: 1px solid #e1e1e1;
        }
        .form-section h3 {
            margin-bottom: 15px;
            color: #34495e;
        }
        .form-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 15px;
        }
        .form-control {
            display: flex;
            flex-direction: column;
        }
        label {
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 5px;
            color: #555;
        }
        input, select {
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 14px;
        }
        button {
            background-color: #3498db;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 16px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.3s;
        }
        button:hover {
            background-color: #2980b9;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }
        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #ddd;
            font-size: 14px;
        }
        th {
            background-color: #2c3e50;
            color: white;
        }
        tr:hover {
            background-color: #f1f1f1;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Hệ Thống Quản Lý Người Lao Động</h1>

    <!-- Form thêm người lao động -->
    <div class="form-section">
        <h3>Thêm Người Lao Động Mới</h3>
        <div class="form-group">
            <div class="form-control">
                <label>Họ tên:</label>
                <input type="text" id="hoTen" placeholder="Nhập họ tên...">
            </div>
            <div class="form-control">
                <label>Mã số:</label>
                <input type="text" id="maSo" placeholder="Nhập mã số...">
            </div>
        </div>
        <div class="form-group">
            <div class="form-control">
                <label>Lương cơ bản (VNĐ):</label>
                <input type="number" id="luongCoBan" placeholder="Nhập lương cơ bản...">
            </div>
            <div class="form-control">
                <label>Chức vụ:</label>
                <select id="chucVu" onchange="doiChucVu()">
                    <option value="quanly">Quản Lý</option>
                    <option value="nhanvien">Nhân Viên</option>
                    <option value="giangvien">Giảng Viên</option>
                </select>
            </div>
        </div>
        <div class="form-group" id="extraField">
            <div class="form-control">
                <label id="lblExtra">Hệ số trách nhiệm:</label>
                <input type="number" id="valExtra" value="1.5" step="0.1">
            </div>
        </div>
        <button onclick="themNguoiLaodong()">Thêm Vào Danh Sách</button>
    </div>

    <!-- Bảng hiển thị danh sách -->
    <h3>Danh Sách Người Lao Động</h3>
    <table>
        <thead>
            <tr>
                <th>Mã Số</th>
                <th>Họ Tên</th>
                <th>Chức Vụ</th>
                <th>Lương Cơ Bản</th>
                <th>Thông Tin Riêng</th>
                <th>Tổng Lương</th>
            </tr>
        <span id="danhSachBody">
        </thead>
        <tbody id="tableBody">
            <!-- Dữ liệu hiển thị ở đây -->
        </tbody>
    </table>
</div>

<script>
    // Mảng dữ liệu ban đầu khớp với file Main.java của bạn
    let danhSach = [
        { maSo: "QL01", hoTen: "Nguyen Van A", chucVu: "Quản Lý", luongCoBan: 10000000, chiTiet: "Hệ số TĐ: 1.5", tongLuong: 10000000 * 1.5 },
        { maSo: "NV01", hoTen: "Tran Thi B", chucVu: "Nhân Viên", luongCoBan: 8000000, chiTiet: "Ngày công: 24", tongLuong: (8000000 / 26) * 24 },
        { maSo: "GV01", hoTen: "Le Van C", chucVu: "Giảng Viên", luongCoBan: 9000000, chiTiet: "Số tiết: 40", tongLuong: 9000000 + (40 * 150000) }
    ];

    function hienThiDanhSach() {
        let tbody = document.getElementById("tableBody");
        tbody.innerHTML = "";
        danhSach.forEach(item => {
            let tr = document.createElement("tr");
            tr.innerHTML = `
                <td><b>${item.maSo}</b></td>
                <td>${item.hoTen}</td>
                <td>${item.chucVu}</td>
                <td>${item.luongCoBan.toLocaleString()} VNĐ</td>
                <td>${item.chiTiet}</td>
                <td><b style="color: #27ae60;">${Math.round(item.tongLuong).toLocaleString()} VNĐ</b></td>
            `;
            tbody.appendChild(tr);
        });
    }

    function doiChucVu() {
        let cv = document.getElementById("chucVu").value;
        let lbl = document.getElementById("lblExtra");
        let val = document.getElementById("valExtra");
        if(cv === "quanly") {
            lbl.innerText = "Hệ số trách nhiệm:";
            val.value = "1.5";
        } else if(cv === "nhanvien") {
            lbl.innerText = "Số ngày công:";
            val.value = "24";
        } else if(cv === "giangvien") {
            lbl.innerText = "Số tiết dạy:";
            val.value = "40";
        }
    }

    function themNguoiLaodong() {
        let hoTen = document.getElementById("hoTen").value;
        let maSo = document.getElementById("maSo").value;
        let luongCoBan = parseFloat(document.getElementById("luongCoBan").value);
        let chucVuType = document.getElementById("chucVu").value;
        let extraVal = parseFloat(document.getElementById("valExtra").value);

        if(!hoTen || !maSo || isNaN(luongCoBan)) {
            alert("Vui lòng điền đầy đủ thông tin!");
            return;
        }

        let chucVu = "";
        let chiTiet = "";
        let tongLuong = 0;

        if(chucVuType === "quanly") {
            chucVu = "Quản Lý";
            chiTiet = `Hệ số TĐ: ${extraVal}`;
            tongLuong = luongCoBan * extraVal;
        } else if(chucVuType === "nhanvien") {
            chucVu = "Nhân Viên";
            chiTiet = `Ngày công: ${extraVal}`;
            tongLuong = (luongCoBan / 26) * extraVal;
        } else if(chucVuType === "giangvien") {
            chucVu = "Giảng Viên";
            chiTiet = `Số tiết: ${extraVal}`;
            tongLuong = luongCoBan + (extraVal * 150000);
        }

        danhSach.push({ maSo, hoTen, chucVu, luongCoBan, chiTiet, tongLuong });
        hienThiDanhSach();

        // Reset form
        document.getElementById("hoTen").value = "";
        document.getElementById("maSo").value = "";
        document.getElementById("luongCoBan").value = "";
    }

    // Chạy hiển thị lần đầu khi mở trang
    hienThiDanhSach();
</script>

</body>
</html>
